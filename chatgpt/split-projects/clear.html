<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>清空数据</title>
<style>
  body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #1a1a1a; color: #fff; text-align: center; }
  .done { font-size: 24px; }
  a { color: #FB923C; }
</style>
</head>
<body>
<div>
  <div class="done" id="msg">正在清空数据...</div>
</div>
<script>
  const count = Object.keys(localStorage).filter(k => k.includes('coachSplit')).length;
  Object.keys(localStorage).filter(k => k.includes('coachSplit')).forEach(k => localStorage.removeItem(k));
  document.getElementById('msg').innerHTML = '已清空 ' + count + ' 条数据。<br><br><a href="coach-app/">进入教练端</a> ｜ <a href="user-app/">进入用户端</a>';
</script>
</body>
</html>
