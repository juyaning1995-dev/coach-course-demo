<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预约演示项目入口</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#171717 0,#0b0b0b 42%,#050505 100%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
    .shell{width:min(920px,100%);display:grid;gap:18px}
    .head{margin-bottom:4px}
    .title{font-size:34px;font-weight:800;line-height:1.2}
    .sub{margin-top:10px;color:#9a9a9a;font-size:15px;line-height:1.8}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
    .card{display:block;text-decoration:none;color:inherit;background:#141414;border:1px solid #2b2b2b;border-radius:20px;padding:24px 22px;box-shadow:0 16px 40px rgba(0,0,0,.22)}
    .eyebrow{display:inline-flex;height:28px;padding:0 12px;border-radius:999px;background:rgba(255,116,55,.12);color:#ff9a6e;align-items:center;font-size:12px;font-weight:700}
    .card h2{margin:18px 0 10px;font-size:26px}
    .card p{margin:0;color:#a5a5a5;font-size:14px;line-height:1.8}
    .jump{margin-top:22px;color:#fff;font-size:15px;font-weight:700}
  </style>
</head>
<body>
  <div class="shell">
    <div class="head">
      <div class="title">预约演示项目</div>
      <div class="sub">两个入口已经拆开了。教练端和用户端使用同一套课程、排班、预约数据，但各自的停留页面和草稿状态独立保存。</div>
    </div>
    <div class="grid">
      <a class="card" href="./coach-app/index.html">
        <span class="eyebrow">Coach App</span>
        <h2>教练端项目</h2>
        <p>课程管理、工作时间、课程日历、排班、代学员预约、课次详情都从这里进入。</p>
        <div class="jump">进入教练端 ›</div>
      </a>
      <a class="card" href="./user-app/index.html">
        <span class="eyebrow">User App</span>
        <h2>用户端项目</h2>
        <p>用户端预约、时段选择、预约确认、我的预约记录在这里独立演示。</p>
        <div class="jump">进入用户端 ›</div>
      </a>
    </div>
  </div>
</body>
</html>
